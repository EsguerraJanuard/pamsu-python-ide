<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAMSU Python IDE</title>
    <script>
      // Pre-paint theme bootstrap. Dark mode exists only for authenticated
      // students on /student routes; everything else stays light. This mirrors
      // the storage rules in src/features/theme/themeStorage.js, and
      // StudentThemeProvider re-applies (or resets) the theme once React mounts.
      (function () {
        try {
          var path = location.pathname;
          if (path !== '/student' && path.indexOf('/student/') !== 0) return;
          if (!localStorage.getItem('pamsu_access_token') || localStorage.getItem('pamsu_user_role') !== 'student') return;
          var user = JSON.parse(localStorage.getItem('pamsu_user_data') || 'null');
          if (!user || user.user_id == null) return;
          var pref = localStorage.getItem('pamsu_theme_pref_v1:' + user.user_id);
          var theme = pref === 'light' || pref === 'dark'
            ? pref
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) { /* default light theme */ }
      })();
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { background-color: #f7f6f3; margin: 0; padding: 0; min-height: 100vh; }
      html.dark, html.dark body, html.dark #root { background-color: #14110f; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
