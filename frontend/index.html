<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAMSU Python IDE</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        background-color: #0f1117 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var errStr = e.error ? e.error.stack : e.message;
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:16px;width:100%;font-family:monospace;white-space:pre-wrap;">' + errStr + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errStr = e.reason ? (e.reason.stack || e.reason.message) : "Unhandled Rejection";
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-size:16px;width:100%;font-family:monospace;white-space:pre-wrap;">' + errStr + '</div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
