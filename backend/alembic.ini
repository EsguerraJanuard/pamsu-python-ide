# PAMSU Python IDE Alembic configuration.
#
# Database credentials and connection URLs must never be committed here.
# backend/alembic/env.py loads DATABASE_URL from backend/.env at runtime.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
timezone = UTC
truncate_slug_length = 60
output_encoding = utf-8

# Keep revision files in the canonical versions directory.
version_locations = %(here)s/alembic/versions

# The real URL is injected by alembic/env.py from DATABASE_URL.
# This value intentionally remains empty.
sqlalchemy.url =


[post_write_hooks]
# No automatic formatter is configured yet.
# Add one only after it is explicitly included in project dependencies.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
